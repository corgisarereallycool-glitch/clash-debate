<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clash Debate</title>
<meta name="description" content="Real-time 1v1 quickfire debating with voice, live captions and an AI judge.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="/">clash<span class="v">.</span><span class="s">.</span></a>
    <div class="hdr-right">
      <button id="micBtn" class="mic off" hidden aria-pressed="false">Mic off</button>
      <span class="record" id="record">0W · 0L · 0D</span>
    </div>
  </header>
  <nav class="rail" id="rail" aria-label="Match progress"></nav>
  <main class="stage" id="stage"><p class="muted">Connecting…</p></main>
  <p class="status" id="status"></p>
</div>
<audio id="remoteAudio" autoplay playsinline></audio>
<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>
</body>
</html>
